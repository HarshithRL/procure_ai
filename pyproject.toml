[project]
name = "procure-ai"
version = "0.1.0"
description = "AI-powered procurement workspace for transforming fragmented purchase information into traceable, evidence-backed vendor decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.20.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_app"]
