[project]
name = "procure-ai"
version = "0.1.0"
description = "AI-powered procurement workspace for transforming fragmented purchase information into traceable, evidence-backed vendor decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core AI Framework
    "langchain>=1.3.14,<2.0",
    "langchain-core>=1.5.3,<2.0",
    "langgraph>=1.2.10,<2.0",
    "deepagents>=0.7.5",
    "databricks-langchain",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    # API & Web Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=1.8.0",
    "flask>=3.0.0",
    "flask-cors>=6.0.5",
    "gunicorn>=22.0.0",
    # waitress: WSGI server used by ops/deployment/run_app.py on Windows,
    # where gunicorn cannot run (it imports the POSIX-only `fcntl` module).
    # Pure Python, no compiled wheels, safe on the Linux Apps build host.
    "waitress>=3.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # Configuration & Validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    # LangChain Components
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # Vector Database & Embeddings
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    # Document Parsing & Imaging
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",  # Image processing for logos
    "requests>=2.31.0",  # For fetching remote logos
    # Database & ORM
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.1",
    # Logging & Observability
    "loguru>=0.7.2",
    "mlflow>=3,<4",
    # Databricks SDK & utilities
    "databricks-sdk==0.125.0",
    "urllib3>=2.2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_app"]
