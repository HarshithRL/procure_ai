# Databricks Asset Bundle Configuration
# Declarative configuration for deploying resources (jobs, pipelines, apps, etc.)
# See: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: procure-ai

# DABs syncs files to workspace only; app lifecycle is managed via CLI
# See deploy.ps1 for the app create/deploy workflow

# Sync configuration: exclude files and directories from deployment
sync:
  exclude:
    # Development and testing directories
    - .venv/
    - .pytest_cache/
    - .mypy_cache/
    - .ruff_cache/
    - __pycache__/
    - "*.pyc"
    
    # IDE and editor files
    - .vscode/
    - .idea/
    - .cursor/
    - .claude/
    
    # Git and version control
    - .git/
    - .gitignore
    - .gitattributes
    
    # Documentation and config that shouldn't be deployed
    - .design_docs/
    - .opencode/
    - .graphifyignore
    - "*.md"
    - AGENTS.md
    - README.md
    - note.md
    - graphify-out/

    # Local runtime artifacts (logs are recreated in-container)
    - data/logs/
    - "*.log"

    # Tests are not needed in the app runtime
    - ops/tests/
    
    # Database and local artifacts (will be recreated on app startup)
    - procure_ai.db
    - "*.db-journal"
    - "*.db-shm"
    - "*.db-wal"
    - instance/
    
    # Build and distribution artifacts
    - dist/
    - build/
    - "*.egg-info/"
    - .eggs/
    
    # Environment variables and secrets
    - .env
    - .env.local
    - ".env.*.local"
    
    # Python package manager
    - uv.lock
    
    # Empty or future directories (not part of Sprint 1)
    - bridge/
    
    # OS files
    - .DS_Store
    - Thumbs.db

# Multi-environment targets (dev/prod)
targets:
  # Development environment (default)
  dev:
    default: true
    mode: development
    workspace:
      # Databricks workspace URL
      host: https://adb-7181820732839861.1.azuredatabricks.net/
      # Workspace path for bundle artifacts
      root_path: /Workspace/Users/harshith.raghunath@etexgroup.com/vendor-agent

  # Production environment
  prod:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net/
      root_path: /Workspace/Users/harshith.raghunath@etexgroup.com/vendor-agent
