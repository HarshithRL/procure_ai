# Databricks App Runtime Configuration
# This file defines how the app runs on Databricks Apps platform
# See: https://docs.databricks.com/dev-tools/databricks-apps/app-runtime

command:
  - "gunicorn"
  - "app:app"
  - "-w"
  - "4"
  - "-b"
  - "0.0.0.0:8000"
  - "--timeout"
  - "60"

env:
  - name: FLASK_ENV
    value: "production"
  - name: DATABASE_URL
    value: "sqlite:////tmp/procure_ai.db"
  - name: SECRET_KEY
    value: "changeme-in-production-use-secrets"

# Resource references (added via Databricks Apps UI)
# - sql-warehouse: For analytical queries
# - database: For Lakebase (future)
# - secret: For storing API keys and secrets
